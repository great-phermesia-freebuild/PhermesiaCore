name: PhermesiaCore
version: 2.0
main: com.greatphermesia.core.PhermesiaCorePlugin
api-version: '1.21'
authors: [Scrutti]
description: Features n shtuff do /info
softdepend: [Essentials, EssentialsX, floodgate, WorldEdit, FastAsyncWorldEdit]

commands:
  help:
    description: Open the information menu.
    usage: /help
    aliases: [?]
  info:
    description: Open the information menu.
    usage: /info
  gc:
    description: Group chat command.
    usage: /gc [info|create|join|leave|delete|list]
  itemblock:
    description: Open item blacklist GUI.
    usage: /itemblock
    permission: itemblock.use
  religion:
    description: Open religion menu.
    usage: /religion
  cosmetics:
    description: Open cosmetics menu.
    usage: /cosmetics
  gadgets:
    description: Open builder gadget brushes.
    usage: /gadgets
  brush:
    description: Inspect or manage builder gadget blocks.
    usage: /brush <inspect|i|remover|course>
  freeze:
    description: Toggle no-update block placement mode.
    usage: /freeze
  unfreeze:
    description: Disable no-update block placement mode.
    usage: /unfreeze
  door:
    description: Create or delete hidden doors.
    usage: /door <create|delete|wand>
  staffreligion:
    description: Staff religion management.
    usage: /staffreligion <religion> <delete|info>
    permission: religion.staff
  rtp:
    description: Open teleport menu.
    usage: /rtp
  rtprandom:
    description: Teleport to random coordinates.
    usage: /rtprandom
  rtpwarp:
    description: Teleport to a random Essentials warp.
    usage: /rtpwarp
  sc:
    description: Staff chat.
    usage: /sc [message]
    aliases: [staffchat]
    permission: staff.chat
  map:
    description: Show server map link.
    usage: /map
    aliases: [servermap]
  tpblock:
    description: Toggle TP request block for a player.
    usage: /tpblock <player>
  tpblocklist:
    description: Show teleport-blocked players.
    usage: /tpblocklist
  playtop:
    description: Show top playtime players.
    usage: /playtop
  scrutv:
    description: Toggle vanish wrapper command.
    usage: /scrutv
    aliases: [vanish]
  clearchat:
    description: Clear public chat.
    usage: /clearchat
    aliases: [cc]
  staffinfo:
    description: Open helper staff information menu.
    usage: /staffinfo
  requestwarp:
    description: Request a new warp at your location.
    usage: /requestwarp <name>
  warprequests:
    description: Open requested warp moderation menu.
    usage: /warprequests
    aliases: [wr]
  punish:
    description: Open punishment control menu for a player.
    usage: /punish <playername>
    permission: punish.manage
  puns:
    description: View punishment status for a player.
    usage: /puns <playername>
    permission: punish.view

permissions:
  staff.chat:
    default: op
  religion.staff:
    default: op
  itemblock.use:
    default: op
  itemblock.whitelist:
    default: op
  gadgets.use:
    default: false
    description: Access to the builder gadgets menu, brushes, and door tools.
  supervanish.use:
    default: op
  supervanish.vanish:
    default: op
  punish.manage:
    default: op
  punish.view:
    default: op
  group.helper:
    default: false
    description: Helper staff access for Scrutti staff tools.
